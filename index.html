<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Ultimate Master Novel Studio v19.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif}
.page-view{display:none}.page-view.active{display:block}
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

<!-- HEADER & ĐIỀU HƯỚNG -->
<header class="bg-slate-900 border-b border-slate-800 px-6 py-3 shadow-md sticky top-0 z-50">
  <div class="flex justify-between items-center max-w-[1700px] mx-auto flex-wrap gap-2">
    <div class="flex items-center space-x-3">
      <span class="bg-indigo-600 text-white font-bold p-1.5 rounded text-sm">TVPL</span>
      <div>
        <h1 class="text-base font-bold text-slate-200">AI Ultimate Master Novel Studio v19.0</h1>
        <p class="text-xs text-slate-400">Hệ thống sáng tác tiểu thuyết toàn diện · Đa dự án · Bộ nhớ nối mạch · AI Kép</p>
      </div>
    </div>
    <nav class="flex gap-1.5 text-xs">
      <button onclick="switchPage('home')" id="nav-home" class="px-3 py-1.5 bg-indigo-600 text-white font-medium rounded-lg transition cursor-pointer">1. Thiết lập & Ý tưởng</button>
      <button onclick="switchPage('bible')" id="nav-bible" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition cursor-pointer">2. Hồ sơ & Bộ nhớ</button>
      <button onclick="switchPage('outline')" id="nav-outline" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition cursor-pointer">3. Mục lục Cây thư mục</button>
      <button onclick="switchPage('reader')" id="nav-reader" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition cursor-pointer">4. Đọc & Sửa chương</button>
    </nav>
  </div>
</header>

<main class="flex-1 p-6 max-w-[1700px] w-full mx-auto">

<!-- TRANG 1: THIẾT LẬP & Ý TƯỞNG -->
<div id="page-home" class="page-view active grid grid-cols-1 lg:grid-cols-12 gap-6">
  <div class="lg:col-span-8 bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4 shadow-xl">
    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
      <h2 class="text-sm font-semibold text-indigo-400">Bước 1: Khởi tạo tác phẩm & Ý tưởng cốt lõi</h2>
      <div class="flex items-center gap-2">
        <label class="text-xs text-slate-400">Chọn dự án:</label>
        <select id="projectSelector" onchange="switchProject(this.value)" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-indigo-300 outline-none"></select>
        <button onclick="createNewProject()" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-lg text-slate-300">+ Truyện mới</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <div><label class="block text-xs text-slate-400 mb-1">Tên tác phẩm</label>
        <input id="storyTitleInput" value="Khách sạn Biển Lặng
