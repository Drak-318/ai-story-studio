<style>
/* =========================
   ANIME BACKGROUND
========================= */

#anime-page-bg{
  position:fixed;
  inset:0;
  z-index:-10;
  overflow:hidden;
  pointer-events:none;
  background:#070b18;
}

.anime-page-slide{
  position:absolute;
  inset:-4%;
  background-size:cover;
  background-position:center;
  opacity:0;
  transform:scale(1.02);
  transition:
    opacity 1.8s ease,
    transform 8s ease;
  filter:saturate(1.08) brightness(.72);
}

.anime-page-slide.active{
  opacity:.42;
  transform:scale(1.08);
}

#anime-page-bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 50% 10%,
      rgba(99,102,241,.18),
      transparent 40%
    ),
    linear-gradient(
      180deg,
      rgba(5,8,25,.38),
      rgba(5,8,25,.88)
    );
}

/* =========================
   BANNER
========================= */

#anime-hero-bg{
  position:absolute;
  inset:0;
  overflow:hidden;
  z-index:0;
}

.anime-hero-slide{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  opacity:0;
  transform:scale(1);
  transition:
    opacity 1.6s ease,
    transform 9s ease;
}

.anime-hero-slide.active{
  opacity:1;
  transform:scale(1.08);
}

#anime-hero-bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      180deg,
      rgba(10,12,35,.12),
      rgba(10,12,35,.72)
    ),
    linear-gradient(
      90deg,
      rgba(79,70,229,.24),
      rgba(217,70,239,.08),
      rgba(16,185,129,.12)
    );
}

/* =========================
   BANNER CONTENT
========================= */

#page-home > div:first-child{
  position:relative !important;
  isolation:isolate;
  border-color:rgba(255,255,255,.13) !important;
  box-shadow:
    0 25px 80px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.08);
}

#page-home > div:first-child > *{
  position:relative;
  z-index:2;
}

#page-home > div:first-child h2{
  text-shadow:
    0 3px 20px rgba(0,0,0,.55);
}

#page-home > div:first-child p{
  color:#e2e8f0 !important;
}

/* =========================
   CARD ANIME GLASS
========================= */

.card{
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:
    0 12px 40px rgba(0,0,0,.18);
}

.box{
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

/* =========================
   GWEN STAGE
========================= */

.gwen-stage{
  position:relative;
  width:100%;
  height:430px;
  margin:0 auto -24px;
  overflow:hidden;
  border-radius:20px;
  isolation:isolate;
  touch-action:pan-y;
}

.gwen-stage::before{
  content:"";
  position:absolute;
  left:4%;
  right:4%;
  bottom:38px;
  height:80px;
  border-radius:50%;
  background:
    radial-gradient(
      ellipse,
      rgba(129,140,248,.35),
      transparent 70%
    );
  filter:blur(18px);
  pointer-events:none;
}

.gwen-stage::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(255,255,255,.05),
      transparent 42%
    );
}

.gwen-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  cursor:grab;
  touch-action:pan-y;
}

.gwen-canvas:active{
  cursor:grabbing;
}

/* =========================
   GWEN CONTROLS
========================= */

.gwen-controls{
  position:absolute;
  left:0;
  right:0;
  bottom:14px;
  z-index:10;

  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
}

.gwen-btn{
  appearance:none;
  border:1px solid rgba(255,255,255,.20);
  background:rgba(15,23,42,.72);
  color:#fff;
  border-radius:999px;
  padding:7px 13px;
  font-size:12px;
  line-height:1;
  cursor:pointer;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:0 5px 18px rgba(0,0,0,.20);
  transition:
    transform .18s ease,
    background .18s ease,
    border-color .18s ease;
}

.gwen-btn:hover{
  transform:translateY(-2px);
  background:rgba(79,70,229,.75);
  border-color:rgba(255,255,255,.35);
}

.gwen-btn:active{
  transform:translateY(0);
}

.gwen-hint{
  position:absolute;
  left:15px;
  right:15px;
  bottom:54px;
  z-index:8;
  text-align:center;
  font-size:11px;
  color:#e2e8f0;
  opacity:.72;
  pointer-events:none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:640px){

  .gwen-stage{
    height:360px;
  }

  .gwen-controls{
    bottom:10px;
  }

  .gwen-btn{
    padding:7px 10px;
    font-size:11px;
  }

  .gwen-hint{
    bottom:52px;
    font-size:10px;
  }
}

/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

  .anime-page-slide,
  .anime-hero-slide{
    transition:none;
    transform:none;
  }
}
</style>

<script>
(function(){

  "use strict";

  /* =====================================================
     CONFIG
  ===================================================== */

  const IMAGE_LIST = [
    "assets/s1.jpg",
    "assets/s2.jpg",
    "assets/s3.jpg",
    "assets/s4.jpg",
    "assets/s5.jpg",
    "assets/s6.jpg",
    "assets/s7.jpg"
  ];

  const GWEN_MODEL = "assets/gwen.glb";

  const REDUCED_MOTION =
    window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;


  /* =====================================================
     HELPERS
  ===================================================== */

  function wait(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function addScript(src){
    return new Promise((resolve,reject)=>{
      const s=document.createElement("script");
      s.src=src;
      s.onload=resolve;
      s.onerror=reject;
      document.head.appendChild(s);
    });
  }


  /* =====================================================
     1. ANIME PAGE BACKGROUND
  ===================================================== */

  function createAnimeBackground(){

    if(document.getElementById("anime-page-bg")) return;

    const bg=document.createElement("div");
    bg.id="anime-page-bg";

    IMAGE_LIST.forEach((src,index)=>{

      const slide=document.createElement("div");

      slide.className="anime-page-slide";

      slide.style.backgroundImage=`url("${src}")`;

      if(index===0){
        slide.classList.add("active");
      }

      bg.appendChild(slide);

    });

    document.body.prepend(bg);

    const slides=[
      ...bg.querySelectorAll(".anime-page-slide")
    ];

    if(REDUCED_MOTION) return;

    let current=0;

    setInterval(()=>{

      slides[current].classList.remove("active");

      current=(current+1)%slides.length;

      slides[current].classList.add("active");

    },7000);
  }


  /* =====================================================
     2. ANIME HERO BANNER
  ===================================================== */

  function createHeroBackground(){

    const hero=
      document.querySelector("#page-home > div:first-child");

    if(!hero) return;

    if(hero.querySelector("#anime-hero-bg")) return;

    const bg=document.createElement("div");

    bg.id="anime-hero-bg";

    IMAGE_LIST.forEach((src,index)=>{

      const slide=document.createElement("div");

      slide.className="anime-hero-slide";

      slide.style.backgroundImage=`url("${src}")`;

      if(index===0){
        slide.classList.add("active");
      }

      bg.appendChild(slide);

    });

    hero.prepend(bg);

    const slides=[
      ...bg.querySelectorAll(".anime-hero-slide")
    ];

    if(REDUCED_MOTION) return;

    let current=0;

    setInterval(()=>{

      slides[current].classList.remove("active");

      current=(current+1)%slides.length;

      slides[current].classList.add("active");

    },7000);
  }


  /* =====================================================
     3. TẠO KHUNG GWEN
  ===================================================== */

  function createGwenStage(){

    const hero=
      document.querySelector("#page-home > div:first-child");

    if(!hero) return;

    const old=
      hero.querySelector(".run-track.big");

    if(!old) return;

    if(hero.querySelector(".gwen-stage")) return;

    const stage=document.createElement("div");

    stage.className="gwen-stage";

    stage.innerHTML=`

      <canvas class="gwen-canvas"></canvas>

      <div class="gwen-hint">
        Bấm vào Gwen để cô ấy chạy sang phía đối diện · Kéo ngang để di chuyển
      </div>

      <div class="gwen-controls">

        <button class="gwen-btn" data-gwen="left">
          ◀
        </button>

        <button class="gwen-btn" data-gwen="auto">
          ▶ Tự chạy
        </button>

        <button class="gwen-btn" data-gwen="right">
          ▶
        </button>

        <button class="gwen-btn" data-gwen="face">
          🔍 Xem mặt
        </button>

      </div>
    `;

    old.replaceWith(stage);

    startGwen(stage);
  }


  /* =====================================================
     4. GWEN 3D
  ===================================================== */

  async function startGwen(stage){

    const canvas=
      stage.querySelector(".gwen-canvas");

    const hint=
      stage.querySelector(".gwen-hint");

    try{

      if(!window.THREE){

        await addScript(
          "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        );
      }

      if(!window.THREE.GLTFLoader){

        await addScript(
          "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"
        );
      }

    }catch(error){

      hint.textContent=
        "Không tải được thư viện 3D.";

      console.error(error);

      return;
    }


    /* =========================
       RENDERER
    ========================= */

    const renderer=
      new THREE.WebGLRenderer({
        canvas,
        alpha:true,
        antialias:true,
        powerPreference:"high-performance"
      });

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio*1.5,
        3
      )
    );

    renderer.outputEncoding=
      THREE.sRGBEncoding;


    /* =========================
       SCENE
    ========================= */

    const scene=
      new THREE.Scene();

    const camera=
      new THREE.PerspectiveCamera(
        28,
        1,
        .05,
        50
      );


    /* =========================
       LIGHT
    ========================= */

    const ambient=
      new THREE.AmbientLight(
        0xffffff,
        2.1
      );

    scene.add(ambient);

    const keyLight=
      new THREE.DirectionalLight(
        0xffffff,
        3.2
      );

    keyLight.position.set(
      3,
      5,
      6
    );

    scene.add(keyLight);

    const fillLight=
      new THREE.DirectionalLight(
        0x9fa8ff,
        2
      );

    fillLight.position.set(
      -4,
      3,
      2
    );

    scene.add(fillLight);


    /* =========================
       CAMERA / POSITION
    ========================= */

    const MODEL_HEIGHT=1.6;

    const CAMERA_DISTANCE=3.65;

    let horizontalLimit=1.25;

    function resize(){

      const width=
        canvas.clientWidth || stage.clientWidth;

      const height=
        canvas.clientHeight || stage.clientHeight;

      renderer.setSize(
        width,
        height,
        false
      );

      camera.aspect=
        width/height;

      camera.updateProjectionMatrix();

      horizontalLimit=
        Math.max(
          .7,
          CAMERA_DISTANCE*
          Math.tan(
            THREE.MathUtils.degToRad(14)
          )*
          camera.aspect
          -.35
        );
    }

    if(window.ResizeObserver){

      new ResizeObserver(resize)
        .observe(stage);

    }else{

      window.addEventListener(
        "resize",
        resize
      );

    }

    resize();


    /* =========================
       STATE
    ========================= */

    let model=null;

    let mixer=null;

    let animations={};

    let currentAnimation="";

    let x=-horizontalLimit*.72;

    let direction=1;

    let moving=false;

    let autoRun=false;

    let faceMode=false;

    let manualDirection=0;

    let drag=null;

    let targetRotation=0;

    let rotation=0;

    let cameraDistance=CAMERA_DISTANCE;

    let lastClick=0;


    /* =========================
       BUTTONS
    ========================= */

    const leftBtn=
      stage.querySelector(
        '[data-gwen="left"]'
      );

    const rightBtn=
      stage.querySelector(
        '[data-gwen="right"]'
      );

    const autoBtn=
      stage.querySelector(
        '[data-gwen="auto"]'
      );

    const faceBtn=
      stage.querySelector(
        '[data-gwen="face"]'
      );


    function updateButtons(){

      autoBtn.textContent=
        autoRun
          ? "⏸ Dừng chạy"
          : "▶ Tự chạy";

      faceBtn.textContent=
        faceMode
          ? "🔍 Toàn thân"
          : "🔍 Xem mặt";
    }


    /* =========================
       ANIMATION
    ========================= */

    function playAnimation(name){

      if(!mixer) return;

      const action=
        animations[name];

      if(!action) return;

      if(currentAnimation===name) return;

      const old=
        animations[currentAnimation];

      if(old){

        old.fadeOut(.18);
      }

      action
        .reset()
        .fadeIn(.18)
        .play();

      currentAnimation=name;
    }


    function findAnimation(names){

      for(const name of names){

        if(animations[name])
          return name;

      }

      return null;
    }


    /* =========================
       LOAD GLB
    ========================= */

    const loader=
      new THREE.GLTFLoader();

    loader.load(

      GWEN_MODEL,

      gltf=>{

        model=gltf.scene;

        scene.add(model);


        /* =====================
           MATERIAL QUALITY
        ===================== */

        model.traverse(obj=>{

          if(
            obj.material &&
            obj.material.map
          ){

            obj.material.map.anisotropy=
              renderer
                .capabilities
                .getMaxAnisotropy();

          }

          if(obj.material){

            obj.material.needsUpdate=true;
          }

        });


        /* =====================
           ANIMATIONS
        ===================== */

        if(gltf.animations.length){

          mixer=
            new THREE.AnimationMixer(
              model
            );

          gltf.animations.forEach(clip=>{

            animations[
              clip.name
            ]=
              mixer.clipAction(
                clip
              );

          });

          const idle=
            findAnimation([
              "Idle_Base",
              "Idle",
              "idle",
              "Idle_01"
            ]);

          if(idle){

            animations[idle]
              .play();

            currentAnimation=idle;

          }else{

            const first=
              gltf.animations[0];

            animations[first.name]
              .play();

            currentAnimation=
              first.name;
          }

        }

        updateButtons();

        hint.textContent=
          "Bấm Gwen để chạy sang phía đối diện · Kéo ngang để di chuyển";

        animate();

      },

      undefined,

      error=>{

        console.error(
          "Gwen GLB error:",
          error
        );

        hint.textContent=
          "Không tải được Gwen. Kiểm tra assets/gwen.glb";
      }
    );


    /* =========================
       MOVE TO OPPOSITE SIDE
    ========================= */

    function runToOtherSide(){

      if(!model) return;

      faceMode=false;

      autoRun=false;

      manualDirection=0;

      direction=
        x<=0
          ? 1
          : -1;

      moving=true;

      updateButtons();
    }


    /* =========================
       BUTTON EVENTS
    ========================= */

    autoBtn.addEventListener(
      "click",
      e=>{

        e.stopPropagation();

        faceMode=false;

        autoRun=!autoRun;

        if(autoRun){

          direction=
            direction || 1;

          moving=true;

        }else{

          moving=false;
        }

        updateButtons();
      }
    );


    faceBtn.addEventListener(
      "click",
      e=>{

        e.stopPropagation();

        faceMode=!faceMode;

        autoRun=false;

        moving=false;

        updateButtons();
      }
    );


    function holdDirection(dir){

      faceMode=false;

      autoRun=false;

      manualDirection=dir;

      direction=dir;

      moving=true;

      updateButtons();
    }


    function releaseDirection(){

      manualDirection=0;

      moving=false;
    }


    leftBtn.addEventListener(
      "pointerdown",
      e=>{

        e.preventDefault();

        holdDirection(-1);
      }
    );


    rightBtn.addEventListener(
      "pointerdown",
      e=>{

        e.preventDefault();

        holdDirection(1);
      }
    );


    window.addEventListener(
      "pointerup",
      releaseDirection
    );


    /* =========================
       KEYBOARD
    ========================= */

    window.addEventListener(
      "keydown",
      e=>{

        const tag=
          document.activeElement &&
          document.activeElement.tagName;

        if(
          tag==="INPUT" ||
          tag==="TEXTAREA" ||
          tag==="SELECT"
        ) return;

        if(e.key==="ArrowLeft"){

          e.preventDefault();

          holdDirection(-1);

        }

        if(e.key==="ArrowRight"){

          e.preventDefault();

          holdDirection(1);
        }
      }
    );


    window.addEventListener(
      "keyup",
      e=>{

        if(
          e.key==="ArrowLeft" ||
          e.key==="ArrowRight"
        ){

          releaseDirection();
        }
      }
    );


    /* =========================
       DRAG
    ========================= */

    canvas.addEventListener(
      "pointerdown",
      e=>{

        drag={
          x:e.clientX,
          y:e.clientY
        };

        canvas.setPointerCapture(
          e.pointerId
        );
      }
    );


    canvas.addEventListener(
      "pointermove",
      e=>{

        if(!drag) return;

        const dx=
          e.clientX-drag.x;

        const dy=
          e.clientY-drag.y;

        /*
         * Chỉ kéo ngang.
         * Kéo dọc vẫn để trình duyệt cuộn.
         */

        if(
          Math.abs(dx) >
          Math.abs(dy)
        ){

          x +=
            dx*
            (
              2.2/
              Math.max(
                1,
                canvas.clientWidth
              )
            );

          x=
            THREE.MathUtils.clamp(
              x,
              -horizontalLimit,
              horizontalLimit
            );

          direction=
            dx>0
              ? 1
              : -1;

          faceMode=false;

          autoRun=false;

          moving=true;

          updateButtons();
        }

        drag.x=e.clientX;
        drag.y=e.clientY;
      }
    );


    canvas.addEventListener(
      "pointerup",
      e=>{

        drag=null;

        moving=false;

        try{
          canvas.releasePointerCapture(
            e.pointerId
          );
        }catch(_){}
      }
    );


    canvas.addEventListener(
      "pointercancel",
      ()=>{
        drag=null;
        moving=false;
      }
    );


    /* =========================
       CLICK GWEN
    ========================= */

    canvas.addEventListener(
      "click",
      e=>{

        const now=
          Date.now();

        /*
         * tránh click sau khi kéo
         */

        if(
          now-lastClick<300
        ) return;

        lastClick=now;

        runToOtherSide();

      }
    );


    /* =========================
       ANIMATION LOOP
    ========================= */

    const clock=
      new THREE.Clock();

    function animate(){

      requestAnimationFrame(
        animate
      );

      const dt=
        Math.min(
          clock.getDelta(),
          .05
        );

      const time=
        clock.elapsedTime;


      if(mixer){

        mixer.update(dt);
      }


      if(!model){

        renderer.render(
          scene,
          camera
        );

        return;
      }


      /* =====================
         MOVE
      ===================== */

      let isMoving=false;

      if(!faceMode){

        if(manualDirection){

          x +=
            manualDirection*
            1.05*
            dt;

          direction=
            manualDirection;

          isMoving=true;

        }else if(autoRun){

          x +=
            direction*
            .70*
            dt;

          isMoving=true;

        }else if(moving){

          x +=
            direction*
            .95*
            dt;

          isMoving=true;
        }


        if(
          x>=horizontalLimit
        ){

          x=horizontalLimit;

          if(autoRun){

            direction=-1;

          }else{

            moving=false;
          }
        }


        if(
          x<=-horizontalLimit
        ){

          x=-horizontalLimit;

          if(autoRun){

            direction=1;

          }else{

            moving=false;
          }
        }
      }


      /* =====================
         ANIMATION STATE
      ===================== */

      const runAnimation=
        findAnimation([
          "Run_Haste",
          "Run",
          "Run_Fast",
          "Walking",
          "Walk"
        ]);

      const idleAnimation=
        findAnimation([
          "Idle_Base",
          "Idle",
          "idle",
          "Idle_01"
        ]);

      if(isMoving){

        if(runAnimation)
          playAnimation(runAnimation);

      }else{

        if(idleAnimation)
          playAnimation(idleAnimation);
      }


      /* =====================
         POSITION
      ===================== */

      model.position.x=x;

      model.position.y=
        isMoving
          ? Math.abs(
              Math.sin(
                time*9
              )
            )*.035
          : 0;


      /* =====================
         FACE DIRECTION
      ===================== */

      if(isMoving){

        targetRotation=
          direction>0
            ? -Math.PI/2
            : Math.PI/2;

      }else{

        /*
         * hơi xoay về phía trước
         */

        targetRotation=
          direction>0
            ? -.18
            : .18;
      }


      rotation +=
        (
          targetRotation-
          rotation
        )*
        Math.min(
          1,
          dt*8
        );

      model.rotation.y=
        rotation;


      /* =====================
         CAMERA
      ===================== */

      const target=
        new THREE.Vector3(
          faceMode
            ? x
            : 0,
          faceMode
            ? MODEL_HEIGHT*.72
            : MODEL_HEIGHT*.52,
          0
        );

      const cameraTarget=
        camera.userData.target ||
        new THREE.Vector3(
          0,
          MODEL_HEIGHT*.52,
          0
        );

      camera.userData.target=
        cameraTarget;

      cameraTarget.lerp(
        target,
        .08
      );


      const wantedDistance=
        faceMode
          ? 1.15
          : CAMERA_DISTANCE;

      cameraDistance +=
        (
          wantedDistance-
          cameraDistance
        )*.08;


      camera.position.set(
        cameraTarget.x,
        cameraTarget.y+.08,
        cameraTarget.z+
        cameraDistance
      );

      camera.lookAt(
        cameraTarget
      );


      renderer.render(
        scene,
        camera
      );
    }

  }


  /* =====================================================
     5. AUTO WRITE BUTTON
     Không phá hệ thống AI hiện tại.
  ===================================================== */

  function setupAutoWriting(){

    /*
     * Nếu web gốc đã có nút này thì không thêm nút thứ hai.
     */

    const existing=
      document.querySelectorAll(
        'button[onclick="writeAllRemaining()"]'
      );

    if(existing.length) return;

    /*
     * Nếu phiên bản web hiện tại dùng writeNext(),
     * thêm nút kế bên.
     */

    document
      .querySelectorAll(
        'button[onclick="writeNext()"]'
      )
      .forEach(button=>{

        const auto=
          document.createElement("button");

        auto.type="button";

        auto.className=
          "btn bg-amber-600 hover:bg-amber-500 font-bold";

        auto.textContent=
          "⚡ Viết tự động đến hết";

        auto.onclick=async()=>{

          if(
            typeof window.writeAllRemaining==="function"
          ){

            await window.writeAllRemaining();

            return;
          }

          /*
           * Fallback:
           * dùng các hàm đang có trong web.
           */

          if(
            typeof window.chapters!=="function" ||
            typeof window.writeChapter!=="function"
          ){

            alert(
              "Phiên bản hiện tại chưa có chức năng viết tự động."
            );

            return;
          }

          let list=
            window.chapters();

          for(const chapter of list){

            if(
              typeof window.done==="function" &&
              window.done(chapter)
            ){

              continue;
            }

            try{

              await window.writeChapter(
                chapter.id
              );

              await wait(1800);

            }catch(error){

              console.error(error);

              break;
            }
          }

        };

        button.after(auto);
      });
  }


  /* =====================================================
     6. INIT
  ===================================================== */

  function init(){

    createAnimeBackground();

    createHeroBackground();

    createGwenStage();

    setupAutoWriting();
  }


  /*
   * Chờ web gốc khởi tạo DOM và các hàm.
   */

  if(
    document.readyState==="loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      ()=>{
        setTimeout(
          init,
          300
        );
      }
    );

  }else{

    setTimeout(
      init,
      300
    );
  }

})();
</script>
