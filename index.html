<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Master Novel Studio - v12.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .page-view { display: none; }
        .page-view.active { display: block; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header & Menu điều hướng đa trang (Tích hợp liền mạch trên web cũ) -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 shadow-md sticky top-0 z-50">
        <div class="flex justify-between items-center max-w-[1700px] mx-auto">
            <div class="flex items-center space-x-3">
                <span class="bg-indigo-600 text-white font-bold p-1.5 rounded text-sm">TVPL</span>
                <div>
                    <h1 class="text-base font-bold tracking-wide text-slate-200">AI Master Novel Studio v12.0</h1>
                    <p class="text-xs text-slate-400">Nền tảng sáng tác tự động, Kinh thánh truyện & Mục lục cây thư mục</p>
                </div>
            </div>

            <!-- Các nút tắt chuyển trang con mượt mà -->
            <nav class="flex gap-1.5 text-xs">
                <button onclick="switchPage('home')" id="nav-home" class="px-3 py-1.5 bg-indigo-600 text-white font-medium rounded-lg transition">🏠 1. Nhập ý tưởng</button>
                <button onclick="switchPage('bible')" id="nav-bible" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition">🛡️ 2. Hồ sơ truyện (Bible)</button>
                <button onclick="switchPage('outline')" id="nav-outline" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition">📚 3. Cây mục lục</button>
                <button onclick="switchPage('reader')" id="nav-reader" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition">📖 4. Đọc truyện chi tiết</button>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 p-6 max-w-[1700px] w-full mx-auto">
        
        <!-- ================= TRANG 1: NHẬP Ý TƯỞNG & PHÂN CẢNH MỒI (HOME) ================= -->
        <div id="page-home" class="page-view active grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-8 bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-4">
                <h2 class="text-sm font-semibold text-indigo-400 border-b border-slate-800 pb-2">✍️ Bước 1: Khởi tạo tác phẩm & Ý tưởng mồi</h2>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Tên tác phẩm</label>
                        <input type="text" id="storyTitleInput" placeholder="Ví dụ: Sói Hoang Trong Hào Môn..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Thể loại văn học</label>
                        <select id="genreInput" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 outline-none focus:border-indigo-500">
                            <option value="hao-mon">Hào môn tranh đấu / Sinh tồn / Trả thù</option>
                            <option value="ngon-tinh">Ngôn tình lãng mạn / Hiện đại</option>
                            <option value="trinh-tham">Trinh thám / Hình sự / Ly kỳ</option>
                            <option value="huyen-huyen">Kỳ ảo / Huyền huyễn / Tiên hiệp</option>
                            <option
